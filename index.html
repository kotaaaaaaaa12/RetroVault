<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="format-detection" content="telephone=no">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <title>Retro Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/vault-theme.css?v=2.13.0">
  <link rel="stylesheet" href="/assets/css/style.css?v=2.13.0" onerror="this.onerror=null;this.href='./assets/css/style.css?v=2.13.0'">
  <script src="/assets/js/i18n.js?v=2.13.0"></script>
  <link rel="stylesheet" href="/assets/css/notices.css?v=2.13.0">
  <script src="/assets/js/notices.js?v=2.13.0"></script>
</head>
<body>
  <script>
    // Remove legacy COI service workers from older Retro Vault builds.
    (() => {
      try {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for (const registration of registrations) {
              const url = registration.active?.scriptURL || registration.waiting?.scriptURL || registration.installing?.scriptURL || "";
              if (url.includes("coi-sw.js")) registration.unregister();
            }
          }).catch(() => {});
        }
      } catch (_) {}
    })();
  </script>
  <div id="boot-probe" data-i18n="bootLoading" style="position:fixed;z-index:99999;left:12px;bottom:12px;max-width:calc(100vw - 24px);padding:10px 12px;background:#111;color:#fff;border:1px solid #444;font:12px/1.4 ui-monospace,monospace">LOADING RETRO VAULT…</div>
  <header class="site-header library-header">
    <div class="library-brand">
      <div class="logo">RETRO VAULT</div>
      <div class="subtitle" data-i18n="subtitle">INSERT COIN TO PLAY</div>
    </div>
    <div class="header-controls">
      <label class="search-wrap" for="search">
        <span class="sr-only" data-i18n="searchGames">Search games</span>
        <input id="search" type="search" placeholder="SEARCH GAMES..." data-i18n-placeholder="searchPlaceholder" autocomplete="off" spellcheck="false">
      </label>

      <label class="language-control" for="language-select">
        <span data-i18n="language">Language</span>
        <select id="language-select" aria-label="Language" data-i18n-aria-label="language">
          <option value="auto" data-i18n="auto">Auto</option>
          <option value="en">English</option>
          <option value="ja" lang="ja">日本語</option>
        </select>
      </label>

      <button id="local-rom-btn" class="local-rom-btn" type="button" data-i18n="openLocal">OPEN LOCAL ROM</button>
      <input id="local-rom-input" class="sr-only" aria-label="Choose a ROM file" data-i18n-aria-label="chooseLocal" tabindex="-1" type="file" autocomplete="off">
      <a class="admin-link" href="/admin/" data-i18n="adminManage">Manage library</a>
    </div>
  </header>

  <main>
    <section id="toolbar" class="toolbar" aria-label="System filters" data-i18n-aria-label="systemFilters">
      <div id="core-filters" class="core-filters" aria-label="System filters" data-i18n-aria-label="systemFilters">
        <button class="filter-btn active" type="button" data-core="all" data-i18n="all">ALL</button>
      </div>
    </section>

    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
    <div id="loading" class="loading" data-i18n="loadingGames">LOADING GAME LIST...</div>
    <section id="game-grid" class="game-grid" aria-label="Games" data-i18n-aria-label="games"></section>

    <section id="empty-state" class="empty-state" hidden>
      <div data-i18n="noGames">NO GAMES FOUND</div>
      <div class="empty-subtitle" data-i18n="searchHint">Try another search or system filter.</div>
    </section>

    <div id="stats" class="stats" aria-live="polite" data-i18n-title="librarySizeHelp" title="Combined ROM size of the games currently shown."></div>
  </main>

  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <div class="modal-heading">
          <div id="modal-title" class="modal-title">-</div>
          <div id="modal-meta" class="modal-meta"></div>
        </div>
        <div class="player-header-actions">
          <button id="saves-btn" class="saves-btn" type="button" data-i18n="localSaves" disabled>Saves</button>
          <button id="close-btn" class="close-btn" type="button" data-i18n="close">CLOSE</button>
        </div>
      </div>

      <div id="player-status" class="player-status" role="status" aria-live="polite" hidden></div>
      <div class="emulator-wrap">
        <iframe
          id="emulator-frame"
          title="Emulator" data-i18n-title="emulatorTitle"
          allow="autoplay; fullscreen; gamepad"
          allowfullscreen
          referrerpolicy="same-origin"
        ></iframe>
      </div>
    </div>
  </div>

  <div id="core-picker" class="core-picker" aria-hidden="true">
    <div class="core-picker-panel" role="dialog" aria-modal="true" aria-labelledby="core-picker-title">
      <div class="core-picker-kicker" data-i18n="localRom">LOCAL ROM</div>
      <div id="core-picker-title" class="core-picker-title" data-i18n="selectSystem">SELECT SYSTEM</div>
      <div id="core-picker-file" class="core-picker-file"></div>
      <div id="core-picker-help" class="core-picker-help"></div>
      <label class="core-picker-label" for="core-picker-select" data-i18n="systemCore">SYSTEM / CORE</label>
      <select id="core-picker-select" class="core-picker-select"></select>
      <div class="core-picker-actions">
        <button id="core-picker-cancel" class="picker-btn secondary" type="button" data-i18n="cancel">CANCEL</button>
        <button id="core-picker-play" class="picker-btn primary" type="button" data-i18n="play">PLAY</button>
      </div>
    </div>
  </div>

  <footer>
    <nav class="footer-links" aria-label="Site links" data-i18n-aria-label="siteLinks">
      <a href="/pages/changelog.html" data-i18n="changelog">Changelog</a>
    </nav>
    <span data-i18n="poweredBy">Powered by</span> <a href="https://emulatorjs.org/" target="_blank" rel="noopener noreferrer">EmulatorJS</a>
    <button id="diagnostics-download" class="diagnostics-download" type="button" data-i18n="saveDiagnostics" hidden>Save diagnostic log</button>
  </footer>

  <script>
    (() => {
      const probe = document.getElementById("boot-probe");
      const showBootError = message => {
        if (!probe) return;
        probe.textContent = message;
        probe.style.background = "#2a0d14";
        probe.style.borderColor = "#ff5d72";
        probe.style.color = "#fff";
      };

      window.addEventListener("error", event => {
        if (event.filename && event.filename.includes("app.js")) {
          console.error("Application startup failed:", event.message);
          showBootError(window.RetroI18n?.t("appError") || "The application could not start.");
        }
      });

      window.addEventListener("unhandledrejection", event => {
        const reason = event.reason instanceof Error ? event.reason.message : String(event.reason || "Unknown promise rejection");
        console.error("Application startup promise failed:", reason);
        showBootError(window.RetroI18n?.t("appError") || "The application could not start.");
      });

      const sources = [
        "/assets/js/app.js?v=2.13.0",
        "./assets/js/app.js?v=2.13.0"
      ];

      const load = index => {
        if (index >= sources.length) {
          showBootError(window.RetroI18n?.t("appLoadError") || "The application files could not be loaded. Reload the page.");
          return;
        }
        const script = document.createElement("script");
        script.src = sources[index];
        script.async = false;
        script.onerror = () => {
          script.remove();
          load(index + 1);
        };
        document.body.appendChild(script);
      };

      load(0);
    })();
  </script>

</body>
</html>
