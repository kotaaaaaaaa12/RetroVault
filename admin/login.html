<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="format-detection" content="telephone=no">
  <title data-i18n="adminLoginTitle">Sign in | Retro Vault</title>
  <link rel="stylesheet" href="/assets/css/admin.css?v=20261028-16">
  <script src="/assets/js/i18n.js?v=20261028-16" defer></script>
  <script type="module" src="/assets/js/login.js?v=20261028-16"></script>
</head>
<body>
  <main class="login">
    <header><h1>RETRO VAULT</h1><label class="language"><span data-i18n="language">Language</span><select id="language-select"><option value="auto" data-i18n="auto">Auto</option><option value="en">English</option><option value="ja">日本語</option></select></label></header>
    <section class="panel">
      <h2 data-i18n="adminSignIn">Sign in</h2>
      <p class="hint" data-i18n="adminLoginHelp">Sign in to play games and manage your private library.</p>
      <form id="login-form">
        <label><span data-i18n="adminPassword">Password</span><input id="password" type="password" autocomplete="current-password" required maxlength="1024"></label>
        <button type="submit" data-i18n="adminSignIn">Sign in</button>
      </form>
      <p id="login-status" class="status" role="status" hidden></p>
    </section>
  </main>
</body>
</html>
